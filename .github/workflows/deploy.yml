name: Deploy to IONOS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA rather than a moving tag: this repository is public
      # and this workflow carries SFTP credentials with write access to the document
      # root, so a retagged action would inherit them. Update SHA and comment together.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Cheap, dependency-free, and the only automatic run this guard gets:
      # guardian's chain cannot be extended without replacing it wholesale.
      - name: Check light-mode contrast
        run: npm run test:contrast

      - name: Build
        run: npm run build

      - name: Deploy via SFTP
        env:
          DEPLOY_SERVER: ${{ secrets.FTP_SERVER }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
          DEPLOY_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp
          lftp -u "$DEPLOY_USER","$DEPLOY_PASS" "sftp://$DEPLOY_SERVER" -e "set sftp:auto-confirm yes; set net:max-retries 3; mirror --reverse --parallel=5 dist/my-website-v2/browser/ /website/; quit"
