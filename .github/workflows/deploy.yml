name: Deploy to IONOS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA rather than a moving tag: this repository is public
      # and this workflow carries SFTP credentials with write access to the document
      # root, so a retagged action would inherit them. Update SHA and comment together.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # The only automatic run these guards get: guardian's chain cannot be
      # extended without replacing it wholesale. Cheap, but no longer
      # dependency-free — it compiles the stylesheets with sass (a devDependency,
      # installed by the step above) instead of pattern-matching their text.
      - name: Check light-mode contrast
        run: npm run test:contrast

      # The module these tests cover decides which files the manual cleanup workflow
      # deletes from this server. Running them here means a regression turns a push red,
      # rather than being discovered at the moment someone dispatches a deletion.
      - name: Check the stale-bundle logic
        run: npm run test:sweep

      - name: Build
        run: npm run build

      - name: Deploy via SFTP
        env:
          DEPLOY_SERVER: ${{ secrets.FTP_SERVER }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
          DEPLOY_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp
          lftp -u "$DEPLOY_USER","$DEPLOY_PASS" "sftp://$DEPLOY_SERVER" -e "set sftp:auto-confirm yes; set net:max-retries 3; mirror --reverse --parallel=5 dist/my-website-v2/browser/ /website/; quit"
