<section id="contact" class="contact section-padding">
  <div class="contact-grid">
    <div class="contact-left">
      <div class="section-label" [appReveal]="0">
        <span class="label-line"></span>
        <span>{{ lang.t().contact.label }}</span>
      </div>
      <h2 class="section-title" [appReveal]="100">{{ lang.t().contact.title }} <span class="accent">{{ lang.t().contact.titleAccent }}</span></h2>
      <p class="contact-intro" [appReveal]="180">{{ lang.t().contact.intro }}</p>

      <div class="contact-details" [appReveal]="260">
        <a href="mailto:mail@ilhan-buenyamin.com" class="contact-link">
          <span class="link-icon">→</span>
          mail&#64;ilhan-buenyamin.com
        </a>
        <div class="social-row">
          <a href="https://github.com/BuenyaminIlhan" target="_blank" aria-label="GitHub">
            <img src="assets/img/Github_icon.svg" alt="" loading="lazy" decoding="async" />
          </a>
          <a href="https://www.linkedin.com/in/b%C3%BCnyamin-ilhan/" target="_blank" aria-label="LinkedIn">
            <img src="assets/img/LinkedIn-icon.svg" alt="" loading="lazy" decoding="async" />
          </a>
        </div>
      </div>
    </div>

    <div class="contact-right" [appReveal]="200">
      <app-contact-wizard />
    </div>
  </div>
</section>
